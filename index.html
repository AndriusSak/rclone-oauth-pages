<h1>Personal rclone OAuth client</h1>
<p>This site hosts the application home page and privacy policy for a personal OAuth client.</p>
<p>The client is used by <a href="https://rclone.org/">rclone</a> on the owner's own machine to back up a single folder of archives into the owner's own Google Drive account. It has no other users.</p>
